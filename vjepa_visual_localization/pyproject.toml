[project]
name = "vjepa-visual-localization"
version = "0.1.0"
description = "Camera-only global visual localization with V-JEPA 2"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "huggingface-hub>=0.27",
  "numpy>=1.26,<1.28",
  "opencv-python>=4.8,<5",
  "pyyaml>=6",
  "safetensors>=0.4",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "transformers>=4.53,<5",
]

[dependency-groups]
dev = [
  "pytest>=7.4,<8",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
