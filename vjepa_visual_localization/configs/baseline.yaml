video:
  # Rolling low-latency profile: the newest 1 s at 4 sampled frames/s.
  clip_duration_sec: 1.0
  num_sampled_frames: 4
  sampling: uniform
  stride_sec: 0.5

synchronization:
  pose_method: interpolate
  pose_tolerance_sec: 0.2
  video_time_offset_sec: 0.0

model:
  checkpoint: facebook/vjepa2-vitl-fpc64-256
  device: cuda
  dtype: float16
  return_local_tokens: true
  normalize_embeddings: true

mapping:
  batch_size: 1

retrieval:
  global_top_k: 20
  similarity: cosine

pose_estimator:
  method: top1
  weighted_alpha: 10.0
  weighted_radius_m: 2.0

temporal:
  enabled: false
  sequence_length: 4

motion_prior:
  enabled: false

online:
  camera_topic: /camera
  pose_topic: /vjepa_pose
  debug_topic: /vjepa_localization/debug
  latent_topic: /vjepa_latent
  frame_id: map
  position_variance_m2: 0.25
  yaw_variance_rad2: 0.12
