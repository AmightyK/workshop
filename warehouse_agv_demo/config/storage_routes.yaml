frame_id: map

trajectory_tracking:
  controller: MPPI
  hard_turn_threshold_rad: 0.75
  corner_rounding_radius_m: 0.90
  corner_curve_samples: 3
  corner_slowdown_radius_m: 2.50
  corner_speed_limit_mps: 0.40

# Fixed coarse routes from the charging dock to a staging pose beside each
# task cabinet. Nav2 keeps that path while LiDAR stops for crossing workers,
# then resumes after they clear. The final slot is selected after staging.
routes:
  storage_A:
    label: "tủ A"
    direct_staging: true
    waypoints:
      - {name: dock_exit, pose: [10.8, -10.0, 3.14159]}
      - {name: east_cross_aisle, pose: [5.5, -10.0, 3.14159]}
      - {name: central_south, pose: [-1.45, -10.0, 1.5708]}
      - {name: cabinet_A_staging, pose: [-1.90, -2.3, 1.5708]}
  storage_B:
    label: "tủ B"
    # The recorded mapping traversal inspects every slot in A before its first
    # visit to B. Use this semantic aisle corridor for staging so a B mission
    # does not replay that A inspection loop; the final B shelf approach still
    # comes from the recorded latent map.
    direct_staging: true
    waypoints:
      - {name: dock_exit, pose: [10.8, -10.0, 3.14159]}
      - {name: east_cross_aisle, pose: [5.5, -10.0, 3.14159]}
      - {name: central_south, pose: [-1.45, -10.0, 1.5708]}
      - {name: cabinet_B_staging, pose: [-1.90, 0.8, 1.5708]}
  storage_C:
    label: "tủ C"
    # Likewise, skip the recorded A/B inspection loops on the way to C.
    direct_staging: true
    waypoints:
      - {name: dock_exit, pose: [10.8, -10.0, 3.14159]}
      - {name: east_cross_aisle, pose: [5.5, -10.0, 3.14159]}
      - {name: central_south, pose: [-1.45, -10.0, 1.5708]}
      - {name: cabinet_C_staging, pose: [-2.5, 3.8, 3.14159]}
