      A01: {anchor: pickup_A01, approach: [-6.25528, -1.94, 1.5708], vjepa_approach: [-6.25528, -1.94, 1.5708], shelf_height: 0.83}
      A02: {anchor: pickup_A02, approach: [-5.03528, -1.94, 1.5708], vjepa_approach: [-5.03528, -1.94, 1.5708], shelf_height: 0.83}
      A03: {anchor: pickup_A03, approach: [-4.31528, -1.94, 1.5708], vjepa_approach: [-4.31528, -1.94, 1.5708], shelf_height: 0.83}
  storage_B:
    slots:
      B01: {anchor: pickup_B01, approach: [-6.25528, 1.06, 1.5708], vjepa_approach: [-6.25528, 1.06, 1.5708], shelf_height: 0.83}
      B02: {anchor: pickup_B02, approach: [-5.03528, 1.06, 1.5708], vjepa_approach: [-5.03528, 1.06, 1.5708], shelf_height: 0.83}
      B03: {anchor: pickup_B03, approach: [-4.31528, 1.06, 1.5708], vjepa_approach: [-4.31528, 1.06, 1.5708], shelf_height: 0.83}
  storage_C:
    slots:
      C01: {anchor: pickup_C01, approach: [-6.25528, 4.06, 1.5708], vjepa_approach: [-6.25528, 4.06, 1.5708], shelf_height: 0.83}
      C02: {anchor: pickup_C02, approach: [-5.03528, 4.06, 1.5708], vjepa_approach: [-5.03528, 4.06, 1.5708], shelf_height: 0.83}
      C03: {anchor: pickup_C03, approach: [-4.31528, 4.06, 1.5708], vjepa_approach: [-4.31528, 4.06, 1.5708], shelf_height: 0.83}
  packing_station:
    slots:
      # The navigation goal is the center of the painted P bay. From this
      # pose the south-facing fork releases the carton well inside the bay.
      # The robot approaches from the north, extends the fork, and releases
      # into the central part of P. Precise docking is unnecessary here: once
      # Nav2 reaches the bay, the fork extends, releases and lowers the carton.
      PACK01: {anchor: dropoff_PACK01, approach: [10.80, -10.60, -1.5708], drop_center: [10.80, -10.60], drop_half_extents: [1.35, 0.85], drop_center_tolerance: [0.30, 0.30], drop_surface_z: 0.055}
  charging_home:
    slots:
      # This is the AGV model pose at startup. The charging pad is 0.82 m
      # behind the model centre, aligned with the rear charging interface.
      HOME01: {anchor: charging_HOME01, approach: [13.90, -10.60, 3.14159], position_tolerance_m: 0.38, pad_center: [14.72, -10.60]}

